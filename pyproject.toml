[build-system]
requires = ["setuptools>=75.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluent-utils"
version = "0.1.15"
description = "Confluent Kafka package"

readme = ".github/readme.md"
requires-python = ">=3.13"

dependencies = [
    "confluent-kafka==2.10.0",
    "fastavro==1.10.0",
    "authlib==1.6.0",
    "attrs==25.3.0",
    "x35-settings==1.3.0",
    "x35-errors==0.1.4",
    "x35-json-logging==0.1.6",
]

[tool.setuptools.packages]
find = {where = ["src"], exclude = ["tests"]}
